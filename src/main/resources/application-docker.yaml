server:
  port: 8081 # El puerto interno del contenedor

spring:
  datasource:
    # Dentro de Docker, el host es el nombre del servicio de la DB en el compose
    url: jdbc:postgresql://${IAM_DB_HOST:iam-db-postgres}:${IAM_DB_PORT:5432}/${IAM_DB_NAME:vankoo_iam_db_dev}
  cloud:
    function:
      definition: userCreatedConsumer
    stream:
      kafka:
        binder:
          # Dentro de Docker, Kafka se ve a través del puerto 9094 (INTERNAL)
          brokers: ${KAFKA_BROKER_HOST:kafka-broker}:${KAFKA_BROKER_PORT:9094}
      bindings:
        userCreated-out-0:
          destination: vankoo.iam.user.created
          content-type: application/json

eureka:
  instance:
    # Usamos el nombre que le daremos al servicio en el docker-compose
    hostname: ${IAM_SERVICE_HOST:iam-service}
    prefer-ip-address: true # CRÍTICO para comunicación entre contenedores
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL:http://discovery-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        # En Docker, es útil exponer todos los endpoints de gestión para monitoreo y debugging
        # Ya que la red es interna, no hay riesgo de exponer información sensible al exterior
        include: "*"