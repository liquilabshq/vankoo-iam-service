spring:
  application:
    name: iam-service # Este nombre usará Eureka para registrar el servicio, por lo que debe ser en minúsculas y sin espacios
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false # En vez de mostrar las consultas SQL, preferimos usar el log de Hibernate para tener más control sobre el formato y la información que se muestra
    hibernate:
      naming:
        physical-strategy: com.liquilabs.vankoo.iam.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    open-in-view: false # Desactiva el Open Session in View para evitar problemas de Lazy Loading en la capa de presentación
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

documentation:
  application:
    title: @project.name@
    description: @project.description@
    version: @project.version@

authorization:
  jwt:
    secret: ${JWT_SECRET}
    expiration:
      days: ${JWT_EXPIRATION_DAYS}

scalar:
  enabled: true
  theme: kepler